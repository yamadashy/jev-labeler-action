name: Jev Labeler
description: Zero-config AI labeling for issues and pull requests with TypeSafe's Jev. One yes/no question per label, no generated text.
author: Kazuki Yamada

branding:
  icon: tag
  color: purple

inputs:
  api-key:
    description: TypeSafe API key. Store it as a repository secret and pass that secret here.
    required: true
  github-token:
    description: "Token used to read labels and apply them. Needs the issues write permission, plus pull-requests read to label a pull request."
    required: true
    default: ${{ github.token }}
  model:
    description: >-
      Jev model to ask. Pinned to a version by default rather than `jev-latest`, so that a threshold
      tuned against one version does not silently shift when the alias moves.
    required: false
    default: jev-1.13.0
  threshold:
    description: A label is applied when its probability is at or above this value, between zero and one.
    required: false
    default: '0.8'
  labels:
    description: >-
      Optional allowlist of labels to consider, separated by newlines or commas.
      Default: every repository label that has a description.
    required: false
    default: ''
  exclude-labels:
    description: >-
      Labels never to apply, separated by newlines or commas. Added to the built-in exclusions
      (duplicate, invalid, wontfix, good first issue, help wanted), which are maintainer decisions
      rather than properties of the text. To have one of those considered, name it in labels or criteria.
    required: false
    default: ''
  criteria:
    description: >-
      Optional YAML mapping of label name to a plain-language condition, overriding or adding to the
      label's GitHub description. A label listed here is considered even if it has no description.
    required: false
    default: ''
  fallback-label:
    description: Label to apply when no label reaches the threshold. Empty means apply nothing.
    required: false
    default: ''
  skip-bots:
    description: >-
      Leave issues and pull requests opened by an app (a login ending in `[bot]`) alone. Bot-authored
      work is template text rather than a report — a Renovate warning reads exactly like a bug report.
    required: false
    default: 'true'
  dry-run:
    description: Evaluate and write the job summary, but apply nothing.
    required: false
    default: 'false'
  max-body-chars:
    description: Bodies longer than this are truncated before being sent to Jev.
    required: false
    default: '6000'
  max-diff-chars:
    description: >-
      Pull requests only. Characters of diff to send alongside the changed-file list, budgeted across
      the whole pull request. Zero, the default, sends paths and statuses only, which measured best.
    required: false
    default: '0'

outputs:
  labels:
    description: JSON array of the labels applied, or that would be applied in a dry run.
  probabilities:
    description: JSON object mapping each evaluated label to its probability.
  model:
    description: The model version that answered, for example `jev-1.13.0`.

runs:
  using: node24
  main: dist/index.cjs
