# Runs the action from this very repository on its own issues, so every change
# on main is exercised end to end, including the write path, before a tag moves.
name: Dogfood

on:
  issues:
    types: [opened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
